<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>小篮球训练台 · 6-15 岁青少年篮球训练工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230E1210'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23E4551D'/%3E%3Cpath d='M7 16h18M16 7v18M9.5 9.5q6.5 6.5 13 0M9.5 22.5q6.5-6.5 13 0' stroke='%230E1210' stroke-width='1.6' fill='none'/%3E%3C/svg%3E" />
<style>
/* ============ 基础 ============ */
:root{
  --ink:#0E1210; --ink2:#141A16; --card:#181F1A; --card2:#1E2620;
  --line:#2B342D; --line2:#3A453C;
  --paper:#F3EEE4; --muted:#96A297; --dim:#6B776E;
  --ball:#E4551D; --ball2:#F07A3F; --balldim:#4A2412;
  --teal:#2E8B74; --sand:#D8C9A3;
  --r:14px;
  --pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--paper);
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  font-size:15px; line-height:1.55; letter-spacing:.01em;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ball);outline-offset:1px}
::selection{background:var(--ball);color:#120a05}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.wrap{max-width:1080px;margin:0 auto;padding:0 var(--pad)}

/* ============ 顶栏 ============ */
.top{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg, var(--ink) 62%, rgba(14,18,16,0));
  padding:14px 0 10px;
}
.top-in{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--ball);position:relative;overflow:hidden}
.brand-mark::before,.brand-mark::after{
  content:"";position:absolute;inset:0;border-radius:50%;
}
.brand-mark::before{border:2px solid var(--ink);opacity:.9;transform:scale(.94)}
.brand-mark::after{background:
  linear-gradient(var(--ink),var(--ink)) 50% 0/2px 100% no-repeat,
  linear-gradient(var(--ink),var(--ink)) 0 50%/100% 2px no-repeat;
  opacity:.9}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:19px;line-height:1.1;letter-spacing:.06em}
.brand-txt span{display:block;font-size:11px;color:var(--muted);letter-spacing:.14em;margin-top:3px}
.top-meta{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:999px;
  border:1px solid var(--line2);background:var(--ink2);font-size:12px;color:var(--muted);white-space:nowrap
}
.chip b{color:var(--paper);font-weight:600}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--teal)}

/* desktop nav */
.nav-top{display:none}

/* ============ 视图容器 ============ */
.view{display:none;padding-top:6px}
.view.on{display:block}
.sec{margin:22px 0 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 10px}
.sec-h h2{margin:0;font-size:16px;letter-spacing:.04em;font-weight:700}
.sec-h .sub{font-size:12px;color:var(--dim)}

/* ============ 卡片 ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.flat{background:transparent}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

/* hero：战术板 */
.hero{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line2);background:#121714;margin-top:4px}
.hero-court{position:absolute;inset:0;opacity:.9}
.hero-body{position:relative;padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px;min-height:196px}
.hero-k{font-size:11px;letter-spacing:.22em;color:var(--muted)}
.hero-t{font-size:27px;line-height:1.18;font-weight:800;letter-spacing:.01em;margin:0;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.hero-t em{font-style:normal;color:var(--ball2)}
.hero-sub{font-size:13px;color:#C9D2C9;max-width:34ch;margin:0}
.hero-foot{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}

/* 磁贴 */
.magnet{display:inline-flex;align-items:center;gap:7px;background:rgba(14,18,16,.72);border:1px solid var(--line2);border-radius:10px;padding:7px 10px;font-size:12px;backdrop-filter:blur(2px)}
.magnet i{width:7px;height:7px;border-radius:2px;background:var(--ball)}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;border:1px solid transparent;transition:transform .12s ease, background .2s}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--ball);color:#170A04}
.btn-p:hover{background:var(--ball2)}
.btn-g{background:var(--ink2);border-color:var(--line2);color:var(--paper)}
.btn-g:hover{border-color:var(--ball)}
.btn-s{min-height:38px;padding:0 13px;font-size:13px;border-radius:10px}
.btn-block{width:100%}

/* 列表 / 训练卡 */
.list{display:grid;gap:10px}
.drill{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;text-align:left;transition:border-color .15s,background .15s}
.drill:hover{border-color:var(--balldim);background:var(--card2)}
.drill-idx{width:44px;height:44px;border-radius:9px;display:grid;place-items:center;background:var(--balldim);color:var(--ball2);font-weight:700;font-size:13px;letter-spacing:.02em}
.drill-n{font-weight:600;font-size:14.5px;line-height:1.3}
.drill-m{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.drill-m span{white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);letter-spacing:.04em}
.tag.a{color:var(--sand);border-color:#4a4230}
.tag.b{color:#8FC7B4;border-color:#22453a}
.tag.c{color:#E8B08F;border-color:#4d3225}

/* 空态 */
.empty{border:1px dashed var(--line2);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:13px}

/* 课表 */
.seg{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.seg-bar{width:8px;align-self:stretch;border-radius:3px;background:var(--ball);opacity:.7}
.seg-p{font-size:10.5px;letter-spacing:.16em;color:var(--dim)}
.seg-n{font-weight:600;font-size:14.5px;margin-top:2px}
.seg-d{font-size:12px;color:var(--muted);margin-top:4px}
.seg-t{font-size:20px;font-weight:800;color:var(--ball2);white-space:nowrap}
.seg-t small{font-size:10px;color:var(--dim);font-weight:500;margin-left:2px}

/* 计时器 */
.timer-wrap{position:sticky;top:64px;z-index:20}
.timer{background:#121714;border:1px solid var(--line2);border-radius:16px;padding:14px}
.timer-n{font-size:11px;letter-spacing:.18em;color:var(--muted)}
.timer-v{font-size:56px;font-weight:800;letter-spacing:.02em;line-height:1;margin:6px 0 2px;color:var(--ball2)}
.timer-v.low{color:#FF6B4A}
.timer-t{font-size:13px;color:var(--muted)}
.progress{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin:10px 0 0}
.progress i{display:block;height:100%;background:var(--ball);width:0;transition:width .3s linear}

/* 表格 */
.tbl{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl th{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.06em}

/* 底部 tabbar */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(14,18,16,.96);border-top:1px solid var(--line2);
  backdrop-filter:blur(10px);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:10px;color:var(--dim);font-size:11px;letter-spacing:.02em}
.tab.on{color:var(--paper);background:var(--ink2)}
.tab.on svg{color:var(--ball)}
.tab svg{width:21px;height:21px}

/* 弹层 */
.sheet-bg{position:fixed;inset:0;z-index:80;background:rgba(6,9,7,.72);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .18s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;max-height:86vh;overflow:auto;background:var(--card);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1),opacity .2s;opacity:0;visibility:hidden;pointer-events:none}
.sheet.on{transform:translateY(0);opacity:1;visibility:visible;pointer-events:auto}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.sheet-t{font-size:18px;font-weight:800;line-height:1.25}
.close{width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);display:grid;place-items:center;flex:0 0 38px}
.kv{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px 10px;font-size:13px;margin:10px 0 0}
.kv dt{color:var(--dim);font-size:11.5px;letter-spacing:.06em}
.kv dd{margin:0}
.blk{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.blk h4{margin:0 0 7px;font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:600}
.blk ul{margin:0;padding-left:17px}
.blk li{margin:4px 0;font-size:13.5px;line-height:1.5}
.note{border-left:2px solid var(--ball);padding:2px 0 2px 10px;font-size:12.5px;color:#D8C9A3;line-height:1.55}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,10px);z-index:90;background:var(--paper);color:#12100C;padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 转盘 */
.wheel-w{position:relative;width:min(78vw,320px);margin:6px auto 0;aspect-ratio:1/1}
.wheel{width:100%;height:100%;transition:transform 2.6s cubic-bezier(.16,.7,.16,1)}
.needle{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:14px solid var(--ball);filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}

/* 计分板 */
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.score-b{border:1px solid var(--line2);border-radius:14px;padding:12px;text-align:center;background:#121714}
.score-b.red{border-color:#5A2B22;background:#1C1210}
.score-b.blue{border-color:#1F3A46;background:#0F1619}
.score-v{font-size:44px;font-weight:800;line-height:1;margin:4px 0 8px}
.score-b.red .score-v{color:#F07A3F}
.score-b.blue .score-v{color:#6FB6C9}
.score-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.score-btns button{height:40px;border-radius:9px;border:1px solid var(--line2);font-weight:700;font-size:13px;background:var(--ink2)}

/* 徽章 */
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;background:var(--card);opacity:.42}
.badge.on{opacity:1;border-color:var(--balldim);background:#1B140F}
.badge svg{width:26px;height:26px;margin:0 auto 6px;color:var(--ball2)}
.badge.on svg{color:var(--ball)}
.badge b{display:block;font-size:12px;font-weight:600}
.badge span{display:block;font-size:10.5px;color:var(--dim);margin-top:2px}

/* 图表 */
.chart{width:100%;height:132px}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:112px;margin-top:6px}
.bars .b{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.bars .v{width:100%;background:var(--ball);border-radius:5px 5px 0 0;min-height:3px;opacity:.85}
.bars .v.zero{background:var(--line2);opacity:.6}
.bars .l{font-size:10.5px;color:var(--dim)}

/* 表单行 */
.field{display:grid;gap:5px;margin:10px 0}
.field label{font-size:11.5px;letter-spacing:.08em;color:var(--muted)}
.field select,.field input,.field textarea{width:100%}

/* 说明页 */
.doc h3{font-size:15px;margin:20px 0 8px}
.doc p,.doc li{font-size:13.5px;color:#CDD6CD;line-height:1.7}
.doc code{background:var(--ink2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12.5px}
.rule{height:1px;background:var(--line);margin:16px 0}

/* 窄屏顶栏 */
@media (max-width:767px){
  .brand-txt span{display:none}
  #topMeta .chip:nth-child(2){display:none}
  .brand-txt b{font-size:18px}
  .hero-t{font-size:26px}
  .grid.g3{grid-template-columns:minmax(0,1fr)}
  .hero-body{min-height:0}
}

/* 桌面端 */
@media (min-width:768px){
  body{padding-bottom:24px;font-size:15.5px}
  .top{padding:18px 0 12px;background:var(--ink);border-bottom:1px solid var(--line)}
  .top-in{gap:20px}
  .brand-txt b{font-size:22px}
  .nav-top{display:flex;gap:4px;flex:1;justify-content:center}
  .nav-top a{font-size:13.5px;color:var(--muted);padding:8px 13px;border-radius:9px;text-decoration:none;letter-spacing:.03em}
  .nav-top a.on{color:var(--ink);background:var(--paper);font-weight:600}
  .nav-top a:hover:not(.on){color:var(--paper)}
  .tabbar{display:none}
  .hero-body{padding:24px;min-height:240px}
  .hero-t{font-size:40px;max-width:20ch}
  .hero-sub{font-size:14.5px}
  .cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
  .cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
  .timer-v{font-size:72px}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sheet{left:auto;right:24px;bottom:24px;width:460px;border-radius:16px;max-height:80vh;border:1px solid var(--line2)}
  .badges{grid-template-columns:repeat(4,minmax(0,1fr))}
  .toast{bottom:32px}
}
@media (min-width:1024px){
  .badges{grid-template-columns:repeat(5,minmax(0,1fr))}
}

/* 打印：教案 */
@media print{
  body{background:#fff;color:#111;padding:0}
  .top,.tabbar,.no-print,.hero-court{display:none!important}
  .view:not(#view-plan-print){display:none!important}
  #view-plan-print{display:block!important}
  .card,.seg{background:#fff;border-color:#bbb;color:#111}
  .seg-t{color:#a33}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>

<body>

<!-- ===== 顶栏 ===== -->
<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div class="brand-txt">
        <b>小篮球训练台</b>
        <span>6–15 岁 · 青少年篮球训练工作台</span>
      </div>
    </div>
    <nav class="nav-top" id="navTop" aria-label="主导航"></nav>
    <div class="top-meta" id="topMeta"></div>
  </div>
</header>

<main class="wrap" id="main">
  <section class="view" id="view-home"></section>
  <section class="view" id="view-build"></section>
  <section class="view" id="view-library"></section>
  <section class="view" id="view-coach"></section>
  <section class="view" id="view-squad"></section>
  <section class="view" id="view-fun"></section>
  <section class="view" id="view-stats"></section>
  <section class="view" id="view-doc"></section>
  <section class="view" id="view-plan-print"></section>
</main>

<div class="tabbar no-print"><div class="tabbar-in" id="tabbar"></div></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   数据层：年龄段 / 分类 / 环节 / 训练库 / 趣味挑战 / 徽章
   字段：id 编号 · n 名称 · cat 分类 · ages 适合年龄 · min 建议时长(分)
        players 人数 · space 场地 · gear 器材 · goal 目标 · setup 组织
        steps 做法 · points 教练要点 · up 进阶 · down 降阶 · fun 趣味化
        phases 可放入的环节
   ===================================================================== */
const AGES = [
  {id:'A', n:'U6–U8', t:'6–8 岁', ball:'3 号球 · 篮筐 2.35m', tip:'单次专注 4–6 分钟，靠游戏和比赛带动，不做长时间排队练习。'},
  {id:'B', n:'U9–U11', t:'9–11 岁', ball:'4–5 号球 · 篮筐 2.60m', tip:'开始建立技术动作标准，每个动作先做对再做快。'},
  {id:'C', n:'U12–U15', t:'12–15 岁', ball:'5–6 号球 · 篮筐 2.90–3.05m', tip:'加入对抗与战术基础，注意负荷控制，避免过早大重量力量训练。'}
];
const CATS = [
  {id:'handle', n:'球感与运球'}, {id:'pass', n:'传接球'}, {id:'shoot', n:'投篮'},
  {id:'foot', n:'脚步与防守'}, {id:'phys', n:'体能与对抗'}, {id:'game', n:'趣味游戏'}
];
const PHASES = [
  {id:'warm', n:'热身激活'}, {id:'tech', n:'技术学习'}, {id:'game', n:'趣味挑战'},
  {id:'match', n:'对抗应用'}, {id:'cool', n:'放松复盘'}
];
const THEMES = [
  {id:'all', n:'综合'}, {id:'handle', n:'运球'}, {id:'pass', n:'传球'},
  {id:'shoot', n:'投篮'}, {id:'foot', n:'防守'}, {id:'phys', n:'体能'}, {id:'game', n:'纯趣味'}
];

const DRILLS = [
{id:'d01', n:'指尖拨球', cat:'handle', ages:['A'], min:6, players:'全体', space:'半场散开', gear:['球人手一个'],
 goal:'建立手指触球的手感，掌心不贴球', setup:'每人一球，间隔一臂距离，教练站中间能看到所有人',

function beep() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    beep.ctx = beep.ctx || new AC();
    const o = beep.ctx.createOscillator(), g = beep.ctx.createGain();
    o.type = 'sine'; o.frequency.value = 900; g.gain.value = 0.12;
    o.connect(g); g.connect(beep.ctx.destination); o.start();
    setTimeout(() => { try { o.stop(); g.disconnect(); } catch (e) {} }, 300);
  } catch (e) {}
}

/* 统计 */
function totalMinutes() { return state.sessions.reduce((s, x) => s + (x.minutes || 0), 0); }
function weekDates() {
  const now = new Date(); const dow = (now.getDay() + 6) % 7;
  const mon = new Date(now); mon.setDate(now.getDate() - dow);
  const arr = [];
  for (let i = 0; i < 7; i++) { const d = new Date(mon); d.setDate(mon.getDate() + i); arr.push(iso(d)); }
  return arr;
}
function weekSessions() { const w = weekDates(); return state.sessions.filter((s) => w.indexOf(s.date) >= 0); }
function streakDays() {
  const dates = Array.from(new Set(state.sessions.map((s) => s.date)));
  if (!dates.length) return 0;
  const cur = new Date(TODAY + 'T00:00:00');
  if (dates.indexOf(TODAY) < 0) cur.setDate(cur.getDate() - 1);
  let n = 0;
  while (dates.indexOf(iso(cur)) >= 0) { n++; cur.setDate(cur.getDate() - 1); }
  return n;
}
function attendanceRate() {
  const roster = state.players.length;
  if (!state.sessions.length || !roster) return null;
  const possible = state.sessions.length * roster;
  const got = state.sessions.reduce((s, x) => s + (x.attendees ? x.attendees.length : 0), 0);
  return Math.min(100, Math.round((got / possible) * 100));
}
function badgeState() {
  const s = state.sessions; const streak = streakDays(); const tot = totalMinutes();
  const perfect = state.players.length > 0 && s.some((x) => (x.attendees || []).length >= state.players.length);
  return {
    first: s.length >= 1, ten: s.length >= 10, streak: streak >= 3,
    min300: tot >= 300, perfect: perfect, wheel: state.flags.wheel >= 5
  };
}

/* 教案生成 */
function pickPool(band, phase, theme) {
  const pool = DRILLS.filter((d) => d.ages.indexOf(band) >= 0 && d.phases.indexOf(phase) >= 0);
  if (!pool.length) return DRILLS.filter((d) => d.ages.indexOf(band) >= 0);
  if (theme === 'all') return pool;
  const preferred = pool.filter((d) => d.cat === theme);
  return preferred.length >= 2 ? preferred.concat(pool.filter((d) => d.cat !== theme)) : pool;
}
function genPlan(band, minutes, theme) {
  const pct = band === 'A'
    ? {warm: 0.20, tech: 0.26, game: 0.26, match: 0.18}
    : band === 'B'
    ? {warm: 0.20, tech: 0.30, game: 0.16, match: 0.24}
    : {warm: 0.18, tech: 0.30, game: 0.10, match: 0.32};
  const durs = {};
  let acc = 0;
  PHASES.slice(0, 4).forEach((ph) => {
    durs[ph.id] = Math.max(5, Math.round(minutes * pct[ph.id] / 5) * 5);
    acc += durs[ph.id];
  });
  durs.cool = minutes - acc;
  if (durs.cool < 5) {
    let need = 5 - durs.cool;
    durs.cool = 5;
    ['match', 'tech', 'game', 'warm'].forEach((k) => {
      if (need <= 0) return;
      const take = Math.min(need, durs[k] - 5);
      durs[k] -= take; need -= take;
    });
  }
  const used = [];
  const segs = [];
  PHASES.forEach((ph) => {
    const dur = durs[ph.id];
    if (dur < 3) return;
    let pool = pickPool(band, ph.id, theme).filter((d) => used.indexOf(d.id) < 0);
    if (!pool.length) pool = pickPool(band, ph.id, theme);
    let n = dur <= 8 ? 1 : dur <= 18 ? 2 : 3;
    const chosen = [];
    while (n > 0 && pool.length) {
      const i = Math.floor(Math.random() * pool.length);
      chosen.push(pool[i]); used.push(pool[i].id); pool.splice(i, 1); n--;
    }
    if (!chosen.length) {
      const any = DRILLS.filter((d) => d.ages.indexOf(band) >= 0);
      chosen.push(any[Math.floor(Math.random() * any.length)]);
    }
    const base = Math.floor(dur / chosen.length);
    chosen.forEach((d, k) => {
      segs.push({phase: ph.id, drillId: d.id, min: k === chosen.length - 1 ? dur - base * (chosen.length - 1) : base});
    });
  });
  const themeN = THEMES.find((t) => t.id === theme).n;
  return {
    id: uid(), title: ageOf(band).t + ' · ' + themeN + '训练课',
    band: band, minutes: minutes, theme: theme, segs: segs,
    createdAt: TODAY
  };
}

/* =====================================================================
   视训：执教（计时器）
   ===================================================================== */
const timer = {plan: null, idx: 0, left: 0, running: false, tick: null};

function planById(id) { return state.plans.find((p) => p.id === id); }
function fmt(sec) { return pad(Math.floor(sec / 60)) + ':' + pad(sec % 60); }

RENDER.coach = function () {
  if (!timer.plan || !timer.plan.segs.length) {
    const list = (state.draft ? [state.draft] : []).concat(state.plans);
    return '<div class="sec" style="margin-top:0">' +
      '<div class="sec-h"><h2>开始一节训练</h2><span class="sub">选一节课，进入带练模式</span></div>' +
      (list.length ? '<div class="list">' + list.map((p, i) =>
        '<button class="drill" data-act="coach-start" data-arg="' + (p.id === (state.draft && state.draft.id) ? 'draft' : p.id) + '">' +
          '<div class="drill-idx num">' + p.minutes + '</div>' +
          '<div style="min-width:0"><div class="drill-n">' + esc(p.title) + '</div>' +
          '<div class="drill-m"><span>' + p.segs.length + ' 个环节</span><span>' + ageOf(p.band).n + '</span><span>' + (i === 0 && state.draft ? '未保存' : esc(p.createdAt)) + '</span></div></div>' +
          '<div class="tag b">开始</div>' +
        '</button>').join('') + '</div>'
      : '<div class="empty">还没有教案，先去「备课」生成一节课。</div>') +
      '</div>';
  }
  const p = timer.plan;
  const seg = p.segs[timer.idx];
  const d = drillOf(seg.drillId) || {n: '未找到动作', points: [], steps: []};
  const total = seg.min * 60;
  const pctv = total ? Math.round((1 - timer.left / total) * 100) : 0;
  return '<div class="sec" style="margin-top:0">' +
    '<div class="timer-wrap"><div class="timer">' +
      '<div class="row between"><div class="timer-n">' + (timer.idx + 1) + ' / ' + p.segs.length + ' · ' + phaseOf(seg.phase).n + '</div>' +
        '<button class="btn btn-g btn-s" data-act="timer-exit">结束本节</button></div>' +
      '<div class="timer-v num" id="timerV">' + fmt(timer.left) + '</div>' +
      '<div class="timer-t" id="timerSegName">' + esc(d.n) + '　·　本段 ' + seg.min + ' 分钟</div>' +
      '<div class="progress"><i id="timerBar" style="width:' + pctv + '%"></i></div>' +
      '<div class="row" style="gap:8px;margin-top:12px">' +
        '<button class="btn btn-p" style="flex:1" data-act="timer-toggle" id="timerBtn">' + (timer.running ? '暂停' : (timer.left === seg.min * 60 ? '开始计时' : '继续')) + '</button>' +
        '<button class="btn btn-g" data-act="timer-prev">上一段</button>' +
        '<button class="btn btn-g" data-act="timer-next">下一段</button>' +
      '</div>' +
    '</div></div>' +

    '<div class="sec"><div class="sec-h"><h2>本段要点</h2><span class="sub">' + catOf(d.cat).n + '</span></div>' +
      '<div class="card"><div class="note">' + esc(d.goal) + '</div>' +
        '<div class="blk"><h4>做法</h4><ul>' + (d.steps || []).map((s, i) => '<li><b class="num">' + (i + 1) + '.</b> ' + esc(s) + '</li>').join('') + '</ul></div>' +
        '<div class="blk"><h4>盯这几点</h4><ul>' + (d.points || []).map((s) => '<li>' + esc(s) + '</li>').join('') + '</ul></div>' +
        '<div class="blk"><h4>带不动了就降阶</h4><div class="note">' + esc(d.down) + '</div></div>' +
      '</div></div>' +

    '<div class="sec"><div class="sec-h"><h2>整节课</h2><span class="sub">' + p.minutes + ' 分钟 · 点一下跳段</span></div>' +
      '<div class="list">' + p.segs.map((s, i) => {
        const dd = drillOf(s.drillId) || {n: '—'};
        const on = i === timer.idx;
        return '<button class="seg" data-act="timer-jump" data-arg="' + i + '" style="' + (on ? 'border-color:var(--ball)' : '') + ';text-align:left;width:100%">' +
          '<div class="seg-bar" style="opacity:' + (on ? 1 : 0.45) + '"></div>' +
          '<div style="min-width:0"><div class="seg-p">' + phaseOf(s.phase).n + (on ? ' · 进行中' : '') + '</div>' +
          '<div class="seg-n">' + esc(dd.n) + '</div></div>' +
          '<div class="seg-t num" style="font-size:15px">' + s.min + '<small>分</small></div>' +
        '</button>';
      }).join('') + '</div></div>' +
    '<div style="height:8px"></div>';
};

function updateTimerDom() {
  const v = $('#timerV'), bar = $('#timerBar'), nm = $('#timerSegName'), btn = $('#timerBtn');
  if (!v || !timer.plan) return;
  const seg = timer.plan.segs[timer.idx];
  const total = seg.min * 60;
  v.textContent = fmt(timer.left);
  v.classList.toggle('low', timer.left <= 30 && timer.left > 0);
  bar.style.width = (total ? Math.round((1 - timer.left / total) * 100) : 0) + '%';
  if (nm) nm.textContent = (drillOf(seg.drillId) || {n: ''}).n + '　·　本段 ' + seg.min + ' 分钟';
  if (btn) btn.textContent = timer.running ? '暂停' : (timer.left === total ? '开始计时' : '继续');
}

function startTick() {
  if (timer.tick) clearInterval(timer.tick);
  timer.tick = setInterval(() => {
    if (!timer.running) return;
    timer.left--;
    if (timer.left <= 0) {
      timer.left = 0; timer.running = false;
      clearInterval(timer.tick); timer.tick = null;
      beep(); toast('本段时间到，换下一段');
    }
    updateTimerDom();
  }, 1000);
}
function mountTimer() {
  if (!timer.plan) return;
  updateTimerDom();
  if (timer.running && !timer.tick) startTick();
}
function startPlan(plan) {
  if (!plan || !plan.segs.length) { toast('这节课还没有环节'); return; }
  if (timer.tick) { clearInterval(timer.tick); timer.tick = null; }
  timer.plan = plan; timer.idx = 0; timer.left = plan.segs[0].min * 60;
  timer.running = false;
  go('coach');
  setTimeout(() => { if (route === 'coach') { updateTimerDom(); toast('准备好了就点开始计时'); } }, 60);
}
function jumpSeg(i) {
  if (!timer.plan) return;
  if (i >= timer.plan.segs.length) { endSheet(); return; }
  if (i < 0) { toast('已经是第一段'); return; }
  if (timer.tick) { clearInterval(timer.tick); timer.tick = null; }
  timer.idx = i; timer.running = false; timer.left = timer.plan.segs[i].min * 60;
  render();
}

let wheelRot = 0;

function wheelSvg() {
  const items = FUN_CHALLENGES.slice(0, 8);
  const step = 360 / items.length;
  const c = 100, r = 94;
  let paths = '', labels = '';
  items.forEach((it, i) => {
    const a1 = -90 + i * step, a2 = a1 + step;
    const x1 = c + r * Math.cos(a1 * Math.PI / 180), y1 = c + r * Math.sin(a1 * Math.PI / 180);
    const x2 = c + r * Math.cos(a2 * Math.PI / 180), y2 = c + r * Math.sin(a2 * Math.PI / 180);
    const fill = i % 2 ? '#1E2620' : '#241A13';
    paths += '<path d="M' + c + ',' + c + ' L' + x1.toFixed(2) + ',' + y1.toFixed(2) +
      ' A' + r + ',' + r + ' 0 0 1 ' + x2.toFixed(2) + ',' + y2.toFixed(2) + ' Z" fill="' + fill + '" stroke="#3A453C" stroke-width="1"/>';
    const mid = a1 + step / 2;
    const tx = c + (r * 0.6) * Math.cos(mid * Math.PI / 180), ty = c + (r * 0.6) * Math.sin(mid * Math.PI / 180);
    const txt = it.s || it.t.slice(0, 4);
    const rot = (mid > 90 && mid < 270) ? mid + 180 : mid;
    labels += '<text x="' + tx.toFixed(1) + '" y="' + ty.toFixed(1) + '" fill="#E9E2D4" font-size="10" text-anchor="middle" dominant-baseline="middle" transform="rotate(' + rot.toFixed(1) + ' ' + tx.toFixed(1) + ',' + ty.toFixed(1) + ')">' + esc(txt) + '</text>';
  });
  return '<svg viewBox="0 0 200 200" width="100%" height="100%">' + paths + labels +
    '<circle cx="100" cy="100" r="16" fill="#E4551D"/><circle cx="100" cy="100" r="6" fill="#0E1210"/></svg>';
}

    '</div>' +

    '<div class="sec-h" style="margin-top:22px"><h2>数据重置</h2><span class="sub">谨慎操作</span></div>' +
    '<div class="card"><div class="row between"><div style="min-width:0"><div style="font-weight:600">清空全部本地数据</div>' +
      '<div class="seg-d">教案、训练记录、球员、体测都会删除，无法恢复。</div></div>' +
      '<button class="btn btn-g btn-s" data-act="reset-all">清空</button></div></div>' +
    '<div style="height:16px"></div>' +
  '</div>';
};

/* =====================================================================
   教案打印
   ===================================================================== */
function printable(plan) {
  if (!plan) return '<div class="empty">没有这节课</div>';
  return '<div style="padding:8px 0">' +
    '<div style="font-size:11px;letter-spacing:.2em;color:#666">小篮球训练台 · 训练教案</div>' +
    '<h1 style="font-size:24px;margin:6px 0 4px">' + esc(plan.title) + '</h1>' +
    '<div style="font-size:12px;color:#555">' + ageOf(plan.band).n + '（' + ageOf(plan.band).t + '） · ' +
      THEMES.find((t) => t.id === plan.theme).n + ' · 共 ' + plan.minutes + ' 分钟 · 生成于 ' + esc(plan.createdAt) + '</div>' +
    '<div style="margin:10px 0;padding:8px 10px;border:1px solid #ccc;font-size:12px">器材与设置：' + ageOf(plan.band).ball + '</div>' +
    '<table style="width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed">' +
      '<colgroup><col style="width:12%"><col style="width:8%"><col style="width:24%"><col style="width:56%"></colgroup>' +
      '<thead><tr style="background:#eee"><th style="text-align:left;padding:6px;border:1px solid #ccc">环节</th>' +
      '<th style="text-align:left;padding:6px;border:1px solid #ccc">分钟</th>' +
      '<th style="text-align:left;padding:6px;border:1px solid #ccc">动作</th>' +
      '<th style="text-align:left;padding:6px;border:1px solid #ccc">组织与教练要点</th></tr></thead><tbody>' +
      plan.segs.map((s) => {
        const d = drillOf(s.drillId) || {n: '—', setup: '', points: []};
        return '<tr><td style="padding:6px;border:1px solid #ccc">' + phaseOf(s.phase).n + '</td>' +
          '<td style="padding:6px;border:1px solid #ccc">' + s.min + '</td>' +
          '<td style="padding:6px;border:1px solid #ccc"><b>' + esc(d.n) + '</b><br><span style="color:#666">' + esc(d.players || '') + '</span></td>' +
          '<td style="padding:6px;border:1px solid #ccc">' + esc(d.setup || '') + '<br>' + (d.points || []).map((p) => '· ' + esc(p)).join('<br>') + '</td></tr>';
      }).join('') +
      '</tbody></table>' +
    '<div style="margin-top:10px;font-size:12px;color:#444"><b>课后复盘：</b>哪一段最顺？哪一段孩子走神？下节课改一处就行。</div>' +
  '</div>';
}
function printPlan(plan) {
  if (!plan) { toast('没有可打印的教案'); return; }
  $('#view-plan-print').innerHTML = printable(plan);
  setTimeout(() => { window.print(); }, 80);
}

/* =====================================================================
   弹层
   ===================================================================== */
function openSheet(html) {
  const s = $('#sheet');
  s.innerHTML = html;
  s.classList.add('on');
  $('#sheetBg').classList.add('on');
}
function closeSheet() {
  $('#sheet').classList.remove('on');
  $('#sheetBg').classList.remove('on');
}

/* =====================================================================
   交互
   ===================================================================== */
function handle(act, arg, el, fd) {
  const b = ui.build;
  switch (act) {
    case 'go': go(arg); break;
    case 'quick-gen':
      state.draft = genPlan(b.band, 60, b.theme);
      go('build'); toast('已生成一节 60 分钟课，可微调'); break;
    case 'set-band': b.band = arg; render(); break;
    case 'set-min': b.minutes = +arg; render(); break;
    case 'set-theme': b.theme = arg; render(); break;
    case 'gen':
      state.draft = genPlan(b.band, b.minutes, b.theme);
      render(); toast('已生成，共 ' + state.draft.segs.length + ' 个环节'); break;
    case 'draft-save': {
      const d = state.draft;
      d.id = uid(); d.createdAt = TODAY;
      state.plans.unshift(d);
      state.draft = null;
      save(); render(); toast('教案已保存'); break;
    }
    case 'draft-print': printPlan(state.draft); break;
    case 'draft-coach': startPlan(state.draft); break;
    case 'plan-print': printPlan(planById(arg)); break;
    case 'plan-del': {
      if (!confirm('删除这份教案？')) return;
      state.plans = state.plans.filter((p) => p.id !== arg); save(); render(); toast('已删除'); break;
    }
    case 'seg-plus': case 'seg-minus': {
      const i = +arg; const s = state.draft.segs[i];
      if (!s) break;
      const delta = act === 'seg-plus' ? 2 : -2;
      const next = s.min + delta;
      if (next < 3) { toast('每段至少 3 分钟'); break; }
      s.min = next;
      state.draft.minutes += delta;
      render(); break;
    }
    case 'seg-del': {
      if (state.draft.segs.length <= 1) { toast('至少要留一个环节'); break; }
      const i = +arg; state.draft.minutes -= state.draft.segs[i].min;
      state.draft.segs.splice(i, 1); render(); break;
    }
    case 'seg-swap': {
      const i = +arg; const seg = state.draft.segs[i];
      const pool = DRILLS.filter((d) => d.ages.indexOf(state.draft.band) >= 0 && d.phases.indexOf(seg.phase) >= 0 && d.id !== seg.drillId);
      if (!pool.length) { toast('这个环节没有别的动作了'); break; }
      seg.drillId = pool[Math.floor(Math.random() * pool.length)].id;
      render(); toast('已换一个动作'); break;
    }
    case 'drill': drillSheet(arg); break;
    case 'drill-add': {
      const d = drillOf(arg);
      if (!state.draft) { state.draft = genPlan(b.band, b.minutes, b.theme); }
      const ph = d.phases[0];
      state.draft.segs.push({phase: ph, drillId: d.id, min: d.min});
      state.draft.minutes += d.min;
      closeSheet(); toast('已加入，去备课页看看'); break;
    }
    case 'lib-band': ui.libBand = arg; render(); break;
    case 'lib-cat': ui.libCat = arg; render(); break;
    case 'coach-start':
      if (arg === 'draft') startPlan(state.draft); else startPlan(planById(arg));
      break;
    case 'timer-toggle':
      if (!timer.plan) break;
      timer.running = !timer.running;
      if (timer.running) { beep(); startTick(); } else if (timer.tick) { clearInterval(timer.tick); timer.tick = null; }
      render(); break;
    case 'timer-next': jumpSeg(timer.idx + 1); break;
    case 'timer-prev': jumpSeg(timer.idx - 1); break;
    case 'timer-jump': jumpSeg(+arg); break;
    case 'timer-exit': endSheet(); break;
    case 'wheel-spin': spinWheel(); break;
    case 'wheel-reset': wheelRot = 0; state.flags.wheel = 0; save(); render(); break;
    case 'score': {
      const k = arg; state.team[k] += +el.dataset.arg2;
      save();
      $('#scoreRed').textContent = state.team.red;
      $('#scoreBlue').textContent = state.team.blue;
      $('#scoreLead').textContent = leadText();
      break;
    }
    case 'score-reset': state.team.red = 0; state.team.blue = 0; save(); render(); toast('比分已清零'); break;
    case 'add-player': {
      const name = (fd.get('name') || '').toString().trim();
      const age = parseInt(fd.get('age'), 10);
      if (!name || !age) { toast('姓名和年龄都要填'); break; }
      const band = age <= 8 ? 'A' : age <= 11 ? 'B' : 'C';
      state.players.push({id: uid(), n: name, age: age, band: band, pos: fd.get('pos')});
      save(); render(); toast('已加入 ' + name); break;
    }
    case 'del-player': {
      const p = state.players.find((x) => x.id === arg);
      if (!p || !confirm('删除球员「' + p.n + '」？历史出勤记录不会连带删除。')) return;
      state.players = state.players.filter((x) => x.id !== arg); save(); render(); break;
    }
    case 'add-measure': {
      const pid = fd.get('pid');
      if (!pid) { toast('先加一名球员'); break; }
      state.measures.unshift({
        id: uid(), pid: pid, date: TODAY,
        height: fd.get('height') || '', weight: fd.get('weight') || '', jump: fd.get('jump') || ''
      });
      save(); render(); toast('已记录'); break;
    }
    case 'end-save': {
      const checks = $$('input[name="att"]:checked');
      const ids = checks.map((c) => c.value);
      state.sessions.unshift({
        id: uid(), title: timer.plan.title, band: timer.plan.band,
        minutes: timer.plan.minutes, date: TODAY, attendees: ids, planId: timer.plan.id
      });
      save(); closeSheet();
      timer.plan = null; timer.idx = 0; timer.left = 0; timer.running = false;
      if (timer.tick) { clearInterval(timer.tick); timer.tick = null; }
      go('stats'); toast('训练已记录：' + ids.length + ' 人出勤');
      break;
    }
    case 'del-session': {
      if (!confirm('删除这条训练记录？')) return;
      state.sessions = state.sessions.filter((s) => s.id !== arg); save(); render(); break;
    }
    case 'reset-all': {
      if (!confirm('清空全部数据？教案、记录、球员都会删除，无法恢复。')) return;
      if (!confirm('再确认一次：真的要全部清空？')) return;
      localStorage.removeItem(LS_KEY);
      state.plans = []; state.sessions = []; state.players = []; state.measures = [];
      state.flags = {wheel: 0}; state.team = {red: 0, blue: 0}; state.draft = null;
      save(); go('home'); toast('已清空'); break;
    }
    case 'close-sheet': closeSheet(); break;
    default: break;
  }
}

function endSheet() {
  if (!timer.plan) return;
  const ps = state.players;
  openSheet('<div class="sheet-h"><div><div class="seg-p">结束本节</div><div class="sheet-t">' + esc(timer.plan.title) + '</div></div>' +
    '<button class="close" data-act="close-sheet" aria-label="关闭">✕</button></div>' +
    '<div class="seg-d">共 ' + timer.plan.minutes + ' 分钟。勾出勤，保存后会记入数据。</div>' +
    (ps.length ? '<div class="list" style="margin-top:12px">' + ps.map((p) =>
      '<label class="row" style="gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;min-height:44px">' +
        '<input type="checkbox" name="att" value="' + p.id + '" checked style="width:20px;height:20px;min-height:20px;flex:0 0 20px">' +
        '<span style="flex:1">' + esc(p.n) + '</span><span class="seg-p">' + ageOf(p.band).n + '</span></label>').join('') + '</div>'
      : '<div class="empty" style="margin-top:12px">名单里还没有球员，可以先保存记录，之后到「球队」加人。</div>') +
    '<div style="margin-top:14px"><button class="btn btn-p btn-block" data-act="end-save">保存训练记录</button></div>');
}

function spinWheel() {
  const items = FUN_CHALLENGES.slice(0, 8);
  const step = 360 / items.length;
  const idx = Math.floor(Math.random() * items.length);
  const target = (270 - (idx * step + step / 2) + 360) % 360;
  const cur = ((wheelRot % 360) + 360) % 360;
  const delta = ((target - cur) + 360) % 360;
  wheelRot += 360 * 5 + delta;
  const w = $('#wheel');
  if (!w) return;
  w.style.transform = 'rotate(' + wheelRot + 'deg)';
  state.flags.wheel++;
  save();
  $('#wheelOut').className = 'empty';
  $('#wheelOut').textContent = '转盘转起来了…';
  setTimeout(() => {
    const c = items[idx];
    const out = $('#wheelOut');
    if (out) {
      out.className = 'card';
      out.style.marginTop = '10px';
      out.innerHTML = '<div class="seg-p">这轮抽到</div><div style="font-weight:800;font-size:17px;margin:4px 0 6px">' + esc(c.t) + '</div>' +
        '<div class="seg-d">' + esc(c.d) + '</div>';
    }
    beep();
  }, 2650);
}

/* =====================================================================
   启动
   ===================================================================== */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) {
    if (e.target.id === 'sheetBg') closeSheet();
    return;
  }
  if (el.tagName === 'FORM') return;
  e.preventDefault();
  handle(el.dataset.act, el.dataset.arg, el);
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-act]');
  if (!f) return;
  e.preventDefault();
  handle(f.dataset.act, '', f, new FormData(f));
});
window.addEventListener('hashchange', render);

(function init() {
  load();
  document.body.insertAdjacentHTML('beforeend', '<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>');
  if (!location.hash) location.hash = '#/home';
  render();
})();
</script>

  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
